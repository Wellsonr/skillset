name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /skillset:...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: skillset version
      description: Shown by `claude plugin list`
      placeholder: "0.3.1"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of /skillset:doctor
      render: text
  - type: input
    id: env
    attributes:
      label: Claude Code version and OS
